<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Tobar House</title>
  <meta name="description" content="Quinn's ideas and playable prototypes.">
  <meta name="theme-color" content="#16151d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tobar">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-well"/></svg>Tobar House</h1>
      <nav class="tabs" aria-label="Sections">
        <a href="#/" id="tabIdeas" class="tab">Ideas</a>
        <a href="#/play" id="tabPlay" class="tab">Play</a>
      </nav>
      <button type="button" id="syncPill" class="sync-pill" aria-live="polite"></button>
      <button type="button" id="menuBtn" class="icon-btn" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg></button>
    </div>
  </header>

  <main id="main">
    <section id="ideasView" aria-label="Ideas">
      <div class="search-row">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search ideas, notes, #tags" autocomplete="off" enterkeyhint="search" aria-label="Search">
        </label>
      </div>
      <div class="chips" id="kindChips" role="toolbar" aria-label="Kind"></div>
      <div class="filters">
        <select id="statusFilter" aria-label="Status"></select>
        <select id="monthFilter" aria-label="Month"></select>
        <select id="sortBy" aria-label="Sort">
          <option value="created">Newest</option>
          <option value="updated">Recently changed</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>
      <div class="chips tags-row" id="tagChips" role="toolbar" aria-label="Tags"></div>
      <div id="list" class="list"></div>
    </section>

    <section id="playView" aria-label="Prototypes" hidden>
      <p class="lede">Little games to try. Each one goes back here with the house button, Escape, or Select + Start held.</p>
      <div id="protos" class="protos"></div>
    </section>
  </main>

  <button type="button" id="newBtn" class="fab" aria-label="Park an idea"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg><span>Park an idea</span></button>

  <!-- One idea: write, tag, file it -->
  <div id="editor" class="sheet editor" data-layer hidden role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <div class="sheet-bar">
      <button type="button" id="edClose" class="text-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back"/></svg>Done</button>
      <span id="edSaved" class="saved"></span>
    </div>
    <div class="sheet-body">
      <textarea id="edTitle" class="ed-title" rows="1" placeholder="What's the idea?" maxlength="200" enterkeyhint="next" data-autofocus></textarea>
      <div class="chips" id="edKind" role="radiogroup" aria-label="Kind"></div>
      <div class="chips" id="edStatus" role="radiogroup" aria-label="Status"></div>
      <div class="tag-edit" id="edTags">
        <input id="edTagInput" placeholder="Add a tag" list="tagList" autocomplete="off" enterkeyhint="done" aria-label="Add a tag">
      </div>
      <datalist id="tagList"></datalist>
      <textarea id="edBody" class="ed-body" placeholder="Notes, links, what makes it good…"></textarea>
      <label class="field">
        <span>Prototype or link</span>
        <input id="edLink" placeholder="/play/my-game/ or https://…" inputmode="url" autocomplete="off">
      </label>
      <a id="edPlay" class="play-link" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-play"/></svg><span>Play it</span></a>
      <button type="button" id="edBuild" class="toggle" role="switch" aria-checked="false">
        <span class="knob"></span>
        <span><b>Ask Claude to build this</b><small>Puts it in the build queue. Say what you'd like to see in the notes.</small></span>
      </button>
      <p id="edDates" class="dates"></p>
      <button type="button" id="edDelete" class="danger">Delete idea</button>
    </div>
  </div>

  <!-- Menu: sync, backups, controller help -->
  <div id="menu" class="sheet menu" data-layer hidden role="dialog" aria-modal="true" aria-label="Menu">
    <div class="sheet-bar">
      <button type="button" id="menuClose" class="text-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back"/></svg>Close</button>
    </div>
    <div class="sheet-body">
      <h2>Sync</h2>
      <p id="menuSync"></p>
      <p id="menuWho" class="muted"></p>
      <div class="btn-row">
        <button type="button" id="syncNow" class="btn">Sync now</button>
        <a id="signIn" class="btn" href="/?signin=1">Sign in again</a>
      </div>
      <h2>Backups</h2>
      <p class="muted">Everything is on the server and on this device. A backup is one file with every idea, for safekeeping.</p>
      <div class="btn-row">
        <button type="button" id="backup" class="btn">Save a backup</button>
        <label class="btn">Load a backup<input id="restore" type="file" accept="application/json,.json" hidden></label>
      </div>
      <h2>Shortcuts</h2>
      <ul class="keys-help" id="keysHelp"></ul>
    </div>
  </div>

  <div id="padHints" class="pad-hints" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-well" viewBox="0 0 32 32"><path d="M5 14 16 5l11 9M8 12.5V27h16V12.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M12 27v-6a4 4 0 0 1 8 0v6" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="15" r="2.2" fill="currentColor"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="k-game" viewBox="0 0 24 24"><path d="M7 8h10a4 4 0 0 1 4 4.2l-.4 3.6a2.4 2.4 0 0 1-4.2 1.3L15 15.5H9l-1.4 1.6a2.4 2.4 0 0 1-4.2-1.3L3 12.2A4 4 0 0 1 7 8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 10.5v3M6.5 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15.5" cy="11" r="1.1" fill="currentColor"/><circle cx="17" cy="13.2" r="1.1" fill="currentColor"/></symbol>
    <symbol id="k-comic" viewBox="0 0 24 24"><path d="M4 5.5h16v10H11l-4.5 3.5v-3.5H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9.5h8M8 12h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="k-painting" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.4 0 1.9-1 1.4-2.1-.6-1.3.2-2.4 1.6-2.4h1.6a3.9 3.9 0 0 0 3.9-3.9C20.5 7 16.7 3.5 12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7.8" cy="11" r="1.3" fill="currentColor"/><circle cx="10.5" cy="7.4" r="1.3" fill="currentColor"/><circle cx="15" cy="7.8" r="1.3" fill="currentColor"/></symbol>
    <symbol id="k-play" viewBox="0 0 24 24"><path d="M3.5 6.5h17M5 6.5V19M19 6.5V19M5 6.5c0 4 3 6 7 6s7-2 7-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 19h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="k-novel" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5Zm0 0v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="k-other" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.3 5.6.2-4.4 3.5 1.6 5.4L12 14.7l-4.7 3.2 1.6-5.4L4.5 9l5.6-.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="k-build" viewBox="0 0 24 24"><path d="M14.5 5.5a4 4 0 0 0-5 5L4 16l2.5 2.5 5.5-5.5a4 4 0 0 0 5-5l-2.4 2.4-2-.5-.5-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  </svg>
</body>
</html>
